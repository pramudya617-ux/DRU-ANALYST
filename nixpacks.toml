# Railway memakai Nixpacks, dan untuk proyek ini ia hanya akan mengenali Node.
# Padahal seluruh pipeline data ditulis dengan Python, jadi python311 HARUS
# diminta eksplisit - tanpa baris ini penjadwal gagal di server dengan
# "spawn python ENOENT" sementara di laptop berjalan normal.
#
# Tidak ada requirements.txt: seluruh langkah yang jalan di server hanya
# memakai pustaka bawaan Python.
#
# openpyxl TIDAK dipasang, dan berkas .xlsx-nya pun tidak ada di sini - jurnal
# aslinya ada di laptop. Hasil parsenya dibekukan ke data/jurnal/*.json dan
# ikut ter-commit; cocok_excel.py membaca berkas beku itu kalau .xlsx tidak
# tersedia. Tanpa pembekuan itu, dataset yang dibangun server kehilangan 176
# call Oracle dan 70 call Iron - menyusut diam-diam, bukan gagal berisik.
#
# Kalau jurnalnya berubah, jalankan di laptop:  python pipa/cocok_excel.py --bekukan

[phases.setup]
nixPkgs = ["nodejs_22", "python311"]

# JANGAN menambahkan "npm ci" di sini. Nixpacks sudah menjalankannya di fase
# install-nya sendiri, dan menjalankannya lagi di fase build menghapus seluruh
# node_modules termasuk /app/node_modules/.cache yang saat itu sedang dipasang
# sebagai cache mount - foldernya terkunci dan build gagal dengan EBUSY.
# Kesalahan ini sudah menjatuhkan dua build di proyek ini.
[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
